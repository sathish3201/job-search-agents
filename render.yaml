services:
  # FastAPI backend — orchestrates job search/ranking, calls out to the phone's
  # Ollama (via OLLAMA_SERVICE_URL) for all LLM inference. No local model here,
  # so this fits Render's free 512MB tier.
  - type: web
    name: job-search-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OLLAMA_SERVICE_URL
        sync: false # set manually in Render dashboard — your ngrok URL rotates, keep it out of git
      - key: OLLAMA_SERVICE_MODEL
        value: phi3:mini
      - key: OLLAMA_SERVICE_API_KEY
        sync: false # set manually in Render dashboard
      - key: RESUME_MD_PATH
        value: ./RESUME.md
      - key: JOB_SEARCH_QUERY
        value: Full Stack Developer
      - key: JOB_SEARCH_LOCATION
        value: Hyderabad, India
      - key: JOB_SEARCH_REMOTE_OK
        value: "true"
      - key: REMOTIVE_ENABLED
        value: "true"
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false

  # React frontend, built as a static site.
  - type: web
    name: job-search-agent-web
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: job-search-agent-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
